server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Catalog Service
    location /api/ {
        proxy_pass http://catalog:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Order Service
    location /api/orders {
        proxy_pass http://order-service:8080/api/orders;
        proxy_set_header Host $host;
    }

    # Payment Service
    location /api/checkout {
        proxy_pass http://payment-service:8080/api/checkout;
        proxy_set_header Host $host;
    }

    # Geo Service
    location /api/geo {
        proxy_pass http://geo-service:8080/api/geo;
        proxy_set_header Host $host;
    }

    # ChatClient
    location /api/chatclient {
        proxy_pass http://chat-client:8080/api/chatclient;
        proxy_set_header Host $host;
    }

    # SignalR WebSocket (order-status hub)
    location /order-status {
        proxy_pass http://order-service:8080/order-status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
