services:

  postgresql:
    # image: postgres:16
    image: postgis/postgis:15-3.3
    container_name: kafe-postgres
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ALLOW_IP_RANGE=0.0.0.0/0
    ports:
      - "5433:5432"
    volumes:
      - /var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: kafe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgresql
    volumes:
      - /var/lib/pgadmin

  redis:
    image: redis
    container_name: kafe-redis
    hostname: redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - /data
  
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: kafe-rabbitmq
    hostname: rabbit
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - /var/lib/rabbitmq