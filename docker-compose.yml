services:
  Postgres-vector:
    image: ankane/pgvector:latest
    container_name: kafe-postgres-vector
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ALLOW_IP_RANGE=0.0.0.0/0
    ports:
      - "5434:5432"
    volumes:
      - /var/lib/postgresql/data
    networks:
      - kfc-vector

  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD=MINIO_ROOT_PASSWORD
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data
    restart: unless-stopped
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgresql:
    # image: postgres:16
    image: postgis/postgis:15-3.3
    container_name: kafe-postgres
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - ALLOW_IP_RANGE=0.0.0.0/0
    ports:
      - "5433:5432"
    volumes:
      - /var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.20.0
    depends_on:
      - postgresql
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - ENABLE_ES=false
  
  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: kafe-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgresql
    volumes:
      - /var/lib/pgadmin

  redis:
    image: redis
    container_name: kafe-redis
    hostname: redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - /data
  
  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: kafe-rabbitmq
    hostname: rabbit
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - /var/lib/rabbitmq

  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: stripe-cli
    command: listen --forward-to http://host.docker.internal:5114/api/Webhooks
    ports:
      - "12111:12111"
    volumes:
      - ./Stripe/stripe.toml:/root/.config/stripe/config.toml

networks:
  kfc-vector:
    driver: bridge

volumes:
  photon_data:
  minio_data:
